<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200 flex justify-between items-center">
    <h2 class="font-bold text-lg">Exercises</h2>
    <p-button icon="pi pi-plus" [rounded]="true" [text]="true" (click)="openNewDialog()"></p-button>
  </div>
  
  <div 
    cdkDropList 
    [cdkDropListConnectedTo]="connectedTo"
    class="flex-1 overflow-y-auto p-4 space-y-3"
  >
    <!-- Pause Block -->
    <div 
      cdkDrag 
      [cdkDragData]="{ type: 'pause' }"
      (dblclick)="onDoubleClick({ type: 'pause' })"
      class="bg-amber-50 p-3 rounded border border-amber-200 shadow-sm cursor-move hover:border-amber-400 transition-colors flex items-center gap-3 select-none"
    >
      <i class="pi pi-clock text-amber-500 text-xl"></i>
      <div>
        <div class="font-medium text-slate-800">Pause</div>
        <div class="text-xs text-slate-500">Rest period</div>
      </div>
      
      <!-- Drag Preview -->
      <div *cdkDragPreview class="bg-amber-50 p-3 rounded shadow-lg border border-amber-500 w-64 flex items-center gap-3">
        <i class="pi pi-clock text-amber-500 text-xl"></i>
        <div class="font-medium">Pause</div>
      </div>
    </div>

    @for (ex of exercises(); track ex.id) {
      <div 
        cdkDrag 
        [cdkDragData]="ex"
        (dblclick)="onDoubleClick(ex)"
        class="bg-white p-3 rounded border border-slate-200 shadow-sm cursor-move hover:border-blue-400 transition-colors group relative select-none"
      >
        <div class="font-medium">{{ ex.name }}</div>
        <div class="text-xs text-slate-500 truncate">{{ ex.instruction }}</div>
        
        <button 
          (click)="openEditDialog(ex)" 
          class="absolute top-2 right-2 text-slate-400 hover:text-blue-600 opacity-0 group-hover:opacity-100 transition-opacity"
        >
          <i class="pi pi-pencil"></i>
        </button>

        <!-- Drag Preview -->
        <div *cdkDragPreview class="bg-white p-3 rounded shadow-lg border border-blue-500 w-64">
          <div class="font-medium">{{ ex.name }}</div>
        </div>
      </div>
    }
  </div>

  <app-exercise-dialog 
    [(visible)]="dialogVisible" 
    [exercise]="selectedExercise"
    (save)="onSave($event)"
  ></app-exercise-dialog>
</div>
