<div class="flex flex-col h-full">
  <div class="p-4 border-b border-slate-200 flex justify-between items-center">
    <h2 class="font-bold text-lg">My Plans</h2>
    <div class="flex gap-2">
      <input 
        #fileInput
        type="file" 
        accept=".json" 
        class="hidden"
        (change)="onFileSelected($event)"
      >
      <button 
        (click)="fileInput.click()" 
        class="p-2 rounded hover:bg-slate-100 text-slate-600"
        title="Import Plan"
      >
        <i class="pi pi-upload"></i>
      </button>
      <button (click)="createNewPlan()" class="p-2 rounded hover:bg-slate-100 text-blue-600" title="New Plan">
        <i class="pi pi-plus"></i>
      </button>
    </div>
  </div>
  
  <div class="flex-1 overflow-y-auto p-2 space-y-1">
    @for (plan of plans(); track plan.id) {
      <div 
        class="p-3 rounded cursor-pointer transition-colors flex items-center gap-2 group justify-between"
        [class.bg-blue-50]="currentPlan()?.id === plan.id"
        [class.text-blue-700]="currentPlan()?.id === plan.id"
        [class.hover:bg-slate-50]="currentPlan()?.id !== plan.id"
        (click)="selectPlan(plan.id)"
      >
        <div class="flex items-center gap-2 truncate">
          <i class="pi pi-file text-slate-400"></i>
          <span class="truncate">{{ plan.name }}</span>
        </div>
        <button 
          (click)="$event.stopPropagation(); deletePlan(plan.id)" 
          class="text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1"
          title="Delete Plan"
        >
          <i class="pi pi-trash"></i>
        </button>
      </div>
    }
  </div>

  <!-- Create Plan Dialog -->
  <p-dialog 
    [(visible)]="createDialogVisible" 
    header="Create New Plan" 
    [modal]="true" 
    [style]="{ width: '400px' }"
  >
    <div class="flex flex-col gap-4 pt-4">
      <div class="flex flex-col gap-2">
        <label for="newPlanName" class="font-semibold">Plan Name</label>
        <input 
          pInputText 
          id="newPlanName" 
          [(ngModel)]="newPlanName" 
          (keydown.enter)="saveNewPlan()"
          class="w-full" 
          autofocus 
        />
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" icon="pi pi-times" (click)="createDialogVisible = false" styleClass="p-button-text"></p-button>
      <p-button label="Create" icon="pi pi-check" (click)="saveNewPlan()" [disabled]="!newPlanName.trim()"></p-button>
    </ng-template>
  </p-dialog>

  <!-- Delete Confirmation Dialog -->
  <p-dialog 
    [(visible)]="deleteDialogVisible" 
    header="Confirm Delete" 
    [modal]="true" 
    [style]="{ width: '400px' }"
  >
    <div class="flex items-center gap-4 pt-4">
      <i class="pi pi-exclamation-triangle text-red-500 text-2xl"></i>
      <p>Are you sure you want to delete this plan?</p>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancel" icon="pi pi-times" (click)="deleteDialogVisible = false" styleClass="p-button-text"></p-button>
      <p-button label="Delete" icon="pi pi-trash" (click)="confirmDelete()" styleClass="p-button-danger"></p-button>
    </ng-template>
  </p-dialog>
</div>
