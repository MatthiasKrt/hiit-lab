<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Stopwatch Body -->
  <circle cx="32" cy="36" r="26" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
  
  <!-- Stopwatch Buttons -->
  <rect x="26" y="2" width="12" height="6" rx="1" fill="#1D4ED8"/>
  <rect x="29" y="0" width="6" height="3" rx="1" fill="#1D4ED8"/>
  <path d="M52 12 L58 6" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Inner Face -->
  <circle cx="32" cy="36" r="22" fill="#FFFFFF"/>
  
  <!-- Runner Figure (Abstract) -->
  <g transform="translate(16, 20) scale(0.8)">
    <!-- Head -->
    <circle cx="20" cy="5" r="4" fill="#3B82F6"/>
    <!-- Body -->
    <path d="M20 10 L20 25 L10 35" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 25 L30 35" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Arms -->
    <path d="M20 15 L10 10" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 15 L30 20" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Ticks -->
  <line x1="32" y1="16" x2="32" y2="18" stroke="#93C5FD" stroke-width="2"/>
  <line x1="32" y1="54" x2="32" y2="56" stroke="#93C5FD" stroke-width="2"/>
  <line x1="14" y1="36" x2="12" y2="36" stroke="#93C5FD" stroke-width="2"/>
  <line x1="52" y1="36" x2="50" y2="36" stroke="#93C5FD" stroke-width="2"/>
</svg>
